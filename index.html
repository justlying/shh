<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="particles-container"></div>

    <div id="verifyScreen" class="password-overlay">
        <div class="password-container">
            <h2>Verify Human</h2>
            <p style="color: #aaa; margin-bottom: 25px; font-size: 14px;">Please confirm you are not a robot</p>
            <button id="notRobotBtn" style="width: 100%; padding: 12px 20px; background: linear-gradient(135deg, rgba(100, 200, 255, 0.2), rgba(255, 100, 200, 0.2)); border: 2px solid rgba(100, 200, 255, 0.5); color: #fff; border-radius: 4px; cursor: pointer; font-size: 16px;">
                I'm Human
            </button>
        </div>
    </div>

    <div id="mainContent" class="hidden-content hidden">
        <nav class="sidebar">
            <div class="nav-items">
                <a href="index.html" class="nav-item active" title="homepage">
                    <i class="fas fa-circle"></i>
                </a>
                <a href="r0x.html" class="nav-item" title="r0x">
                    <i class="fas fa-key"></i>
                </a>
                <a href="s3hhh.html" class="nav-item" title="S3hhh">
                    <i class="fas fa-lock"></i>
                </a>
            </div>
        </nav>

        <button class="follow-btn" id="followBtn">site</button>

        <div id="popup" class="popup hidden">
            <div class="popup-content">
                <span class="popup-close">&times;</span>
                <iframe src="https://manmansecuredgamesgithubio.vercel.app" frameborder="0" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script src="particles.js"></script>
    <script src="script.js"></script>
    <script>
        function isInsideIframe() {
            try {
                return window.self !== window.top;
            } catch (e) {
                return true;
            }
        }

        function isAboutBlank() {
            try {
                return window.location.href === 'about:blank';
            } catch (e) {
                return false;
            }
        }

        function openAboutBlank() {
            const newTab = window.open('about:blank', '_blank');
            if (newTab) {
                const html = `
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <meta charset="UTF-8">
                        <style>
                            * { box-sizing: border-box; }
                            html, body { margin: 0; width: 100%; height: 100%; background: #111; }
                            iframe { width: 100%; height: 100%; border: 0; }
                        </style>
                    </head>
                    <body>
                        <iframe src="https://shh-pied.vercel.app" sandbox="allow-scripts allow-forms allow-popups allow-same-origin allow-top-navigation"></iframe>
                    </body>
                    </html>
                `;
                newTab.document.open();
                newTab.document.write(html);
                newTab.document.close();
            }
        }

        const verifyScreen = document.getElementById('verifyScreen');
        const mainContent = document.getElementById('mainContent');
        const notRobotBtn = document.getElementById('notRobotBtn');

        // Auto-detect about:blank and skip verification
        if (isAboutBlank()) {
            verifyScreen.classList.add('hidden');
            mainContent.classList.remove('hidden');
        } else {
            // Only show verification screen on the actual site
            notRobotBtn.addEventListener('click', function() {
                verifyScreen.classList.add('hidden');
                mainContent.classList.remove('hidden');

                if (!isInsideIframe()) {
                    openAboutBlank();
                    window.close();
                }
            });
        }
    </script>
</body>
</html>
