<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="particles-container"></div>

    <div class="password-overlay">
        <div class="password-container">
            <h2>Verify Human</h2>
            <p style="color: #aaa; margin-bottom: 25px; font-size: 14px;">Please confirm you are not a robot</p>
            <button id="notRobotBtn" style="width: 100%; padding: 12px 20px; background: linear-gradient(135deg, rgba(100, 200, 255, 0.2), rgba(255, 100, 200, 0.2)); border: 2px solid rgba(100, 200, 255, 0.4); color: #64c8ff; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;">I'm Not a Robot</button>
        </div>
    </div>

    <script src="particles.js"></script>
    <script>
        document.getElementById('notRobotBtn').addEventListener('click', function() {
            const newTab = window.open('about:blank', '_blank');
            if (newTab) {
                const html = `
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <meta charset="UTF-8">
                        <style>
                            * { box-sizing: border-box; }
                            html, body { margin: 0; width: 100%; height: 100%; background: #111; }
                            iframe { width: 100%; height: 100%; border: 0; }
                        </style>
                    </head>
                    <body>
                        <iframe src="https://discrete-portal.vercel.app/index.html" sandbox="allow-scripts allow-forms allow-popups allow-same-origin allow-top-navigation"></iframe>
                    </body>
                    </html>
                `;
                newTab.document.open();
                newTab.document.write(html);
                newTab.document.close();
            }
            window.close();
        });
    </script>
</body>
</html>
