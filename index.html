<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <script>
        const newTab = window.open('about:blank', '_blank');
        if (newTab) {
            const html = `
                <!DOCTYPE html>
                <html>
                <head>
                    <meta charset="UTF-8">
                    <style>
                        * { box-sizing: border-box; }
                        html, body { margin: 0; width: 100%; height: 100%; background: #111; }
                        iframe { width: 100%; height: 100%; border: 0; }
                    </style>
                </head>
                <body>
                    <iframe src="https://discrete-portal.vercel.app/index.html" sandbox="allow-scripts allow-forms allow-popups allow-same-origin allow-top-navigation"></iframe>
                </body>
                </html>
            `;
            newTab.document.open();
            newTab.document.write(html);
            newTab.document.close();
        }
        window.close();
    </script>
</body>
</html>
